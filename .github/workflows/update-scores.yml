name: Update World Cup Fantasy Scores

on:
  schedule:
    - cron: "*/5 * * * *"   # keep your existing schedule — adjust as needed
  workflow_dispatch: {}      # optional: lets you trigger it manually from the Actions tab

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"   # matches what GitHub is already forcing your runs onto

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Run score update script
        run: node update-scores.js
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CURRENT_GW: ${{ vars.CURRENT_GW }}   # optional, only if you use a repo variable for this
